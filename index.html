<title>Ventas · El Mero Mero</title>
<style>
:root{--bg:#f4f4f2;--sf:#ffffff;--sf2:#f0f0ed;--tx:#1b1b1a;--tx2:#63625e;--bd:rgba(0,0,0,.14);--ac:#185FA5;--warn:#a85f00;--bad:#b3261e;--ok:#1b7a3a}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--sf:#1e1d1c;--sf2:#2a2927;--tx:#f1f0ec;--tx2:#a9a79f;--bd:rgba(255,255,255,.16);--warn:#e6a64a;--bad:#f2786f;--ok:#5ccb8b}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--sf);display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:.5px solid var(--bd);padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header b{font-size:16px;font-weight:600}
main{flex:1;padding:12px 14px calc(84px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:560px;margin:0 auto;background:var(--sf);border-top:.5px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;border-radius:0;background:transparent;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--tx2)}
nav button.on{background:var(--ac);color:#fff;font-weight:600}
button,select,input{font:inherit;color:var(--tx)}
button{min-height:42px;padding:0 14px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.5;cursor:default}
button.pri,button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
button.ib{min-height:40px;width:40px;padding:0;display:inline-flex;align-items:center;justify-content:center}
input,select{width:100%;min-height:44px;padding:0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);font-size:16px}
input[type=checkbox]{width:22px;min-height:22px;height:22px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.lbl{font-size:12px;color:var(--tx2)}
.big{font-size:22px;font-weight:600}
.m{background:var(--sf2);border-radius:10px;padding:12px}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid var(--bd)}
.row.tap{cursor:pointer}
.row .r{display:flex;align-items:center;gap:6px;flex-shrink:0}
.seg{display:flex;gap:8px;margin:10px 0}
.seg button{flex:1}
.h{font-size:13px;color:var(--tx2);margin:14px 0 4px}
.msg,.err,.wn{padding:10px 12px;border-radius:8px;font-size:14px;margin-bottom:12px}
.msg{background:rgba(27,122,58,.12);color:var(--ok)}
.err{background:rgba(179,38,30,.12);color:var(--bad)}
.wn{background:rgba(168,95,0,.12);color:var(--warn)}
.f{margin-bottom:10px}
.f .lbl{margin-bottom:3px}
.login{padding:calc(40px + env(safe-area-inset-top)) 22px 22px;display:flex;flex-direction:column;gap:6px;flex:1;justify-content:center}
.login h1{font-size:26px;margin:0}
.center{flex:1;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.ok{color:var(--ok)}
.bad{color:var(--bad)}
.warnc{color:var(--warn)}
.sub{font-size:12px;color:var(--tx2)}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--sf2);color:var(--tx2);white-space:nowrap}
.aud{padding:10px 0;border-bottom:.5px solid var(--bd)}
.aud .t{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.aud .d{font-size:13px;color:var(--tx2);margin-top:3px}
</style>
</head>
<body>
<div id="app"><div class="center">Cargando…</div></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function () {
'use strict';

/* ---------- Conexión (claves públicas; la seguridad la dan los roles de la base de datos) ---------- */
var SUPABASE_URL = 'https://gkhomooeuogtwhasdyuo.supabase.co';
var SUPABASE_KEY = 'sb_publishable_6vB64x8E8iTsOIKfXsmzOg_yh2Gg0sU';
var VERSION = '3';

var app = document.getElementById('app');
if (!window.supabase) {
  app.innerHTML = '<div class="center" style="padding:24px;text-align:center">No se pudo cargar la aplicación. Revisa tu conexión a internet y vuelve a abrirla.</div>';
  return;
}
var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var A = {};
window.A = A;

/* ---------- Utilidades ---------- */
var MS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return '$' + (Math.round((+n || 0) * 100) / 100).toFixed(2); }
function num(s){ return parseFloat(String(s == null ? '' : s).replace(',', '.')); }
function fdate(s){ if(!s) return ''; var p = String(s).slice(0,10).split('-'); return (+p[2]) + ' ' + MS[+p[1]-1]; }
function hoy(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Caracas'}).format(new Date()); }
function addDays(s, n){ var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2] + n)).toISOString().slice(0,10); }
function dtime(ts){
  try { return new Date(ts).toLocaleString('es-VE', {timeZone:'America/Caracas', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}); }
  catch (e) { return String(ts); }
}
function errTxt(e){
  var m = (e && e.message) || String(e || '');
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';
  if (/row-level security|permission denied/i.test(m)) return 'Tu usuario no tiene permiso para esta acción.';
  if (/Invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  return m || 'Ocurrió un error. Inténtalo de nuevo.';
}
var IC = {
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  cobrar:'<path d="M17 7L7 17M17 17H7V7"/>',
  pagar:'<path d="M7 17L17 7M7 7h10v10"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  next:'<path d="M9 6l6 6-6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
function ic(n, s){ s = s || 20; return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'; }
function setMsg(m){ S.msg = m; S.err = ''; }
function setErr(m){ S.err = m; S.msg = ''; }

/* Formas de pago del mostrador: [columna en la base de datos, etiqueta] */
var FP = [['efectivo','Efectivo'], ['punto_venta_1','Punto de venta 1'], ['punto_venta_2','Punto de venta 2'], ['pago_movil','Pago móvil']];

/* ---------- Estado ---------- */
var S = {
  boot:true, user:null, rol:null, nombre:'', em:'', tab:'venta', busy:false, msg:'', err:'',
  clientes:[], productos:[], proveedores:[], perfiles:[], perfMap:{},
  vm:'cli',
  v:{cli:'', prod:'', kilos:'1', lineas:[], forma:'contado'},
  mo:{fecha:'', v:{efectivo:'', punto_venta_1:'', punto_venta_2:'', pago_movil:''}, existe:null, lista:[], cargando:false},
  ini:null, saldos:null, hist:null, mas:'menu', ce:null, pe:null, pf:null, pve:null,
  pagar:{saldos:null, hist:null, compra:null},
  aud:{filtro:'', lista:null}
};

function nameOf(id){
  if (!id) return 'Sistema';
  var p = S.perfMap[id];
  if (p) return p.nombre || p.correo || 'Usuario';
  return (S.user && id === S.user.id) ? S.nombre : 'Usuario';
}

/* ---------- Vistas ---------- */
function banner(){ return (S.msg ? '<div class="msg">'+esc(S.msg)+'</div>' : '') + (S.err ? '<div class="err">'+esc(S.err)+'</div>' : ''); }

function vLogin(){
  return '<div class="login"><h1>Ventas</h1><div class="lbl" style="margin-bottom:14px">Pescadería El Mero Mero</div>' +
    banner() +
    '<form onsubmit="return A.login(event)">' +
    '<div class="f"><div class="lbl">Correo</div><input id="em" type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="off" value="'+esc(S.em)+'"></div>' +
    '<div class="f"><div class="lbl">Contraseña</div><input id="pw" type="password" name="password" autocomplete="current-password"></div>' +
    '<button class="pri" type="submit" style="width:100%"'+(S.busy?' disabled':'')+'>'+(S.busy?'Entrando…':'Entrar')+'</button>' +
    '</form></div>';
}

function vHead(){
  var t = {inicio:'Inicio', venta:(S.vm === 'mos' ? 'Total de mostrador' : 'Venta a cliente'), cobrar:'Cuentas por cobrar', pagar:'Cuentas por pagar', mas:'Más'}[S.tab];
  if (S.tab === 'cobrar' && S.hist) t = S.hist.nombre;
  if (S.tab === 'pagar' && S.pagar.hist) t = S.pagar.hist.nombre;
  if (S.tab === 'mas') t = {menu:'Más', clientes:'Clientes', proveedores:'Proveedores', productos:'Productos', usuarios:'Usuarios', auditoria:'Registro de cambios'}[S.mas] || 'Más';
  return '<header><div><b>'+esc(t)+'</b><div class="lbl">'+esc(S.nombre)+' · '+(S.rol === 'admin' ? 'Administrador' : 'Empleado')+'</div></div>' +
    '<button class="ib" onclick="A.salir()" aria-label="Cerrar sesión">'+ic('out')+'</button></header>';
}

function vNav(){
  if (S.rol !== 'admin') return '';
  var T = [['inicio','home','Inicio'],['venta','plus','Venta'],['cobrar','cobrar','Cobrar'],['pagar','pagar','Pagar'],['mas','menu','Más']];
  return '<nav>' + T.map(function(t){
    return '<button class="'+(S.tab === t[0] ? 'on' : '')+'" onclick="A.go(\''+t[0]+'\')">'+ic(t[1])+t[2]+'</button>';
  }).join('') + '</nav>';
}

function vInicio(){
  if (!S.ini) return banner() + '<div class="lbl">Cargando…</div>';
  var i = S.ini, h = banner();
  if (!i.hayMos) h += '<div class="wn" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Falta el total de mostrador de hoy</span><button onclick="A.irMostrador()">Registrar</button></div>';
  h += '<div class="g"><div class="m"><div class="lbl">Ventas hoy</div><div class="big">'+money(i.vh)+'</div></div>' +
    '<div class="m"><div class="lbl">Cobrado hoy</div><div class="big">'+money(i.ch)+'</div></div>' +
    '<div class="m"><div class="lbl">Por cobrar</div><div class="big warnc">'+money(i.pc)+'</div></div>' +
    '<div class="m"><div class="lbl">Por pagar</div><div class="big bad">'+money(i.pp)+'</div></div></div>' +
    '<div class="h">Últimas ventas a clientes</div>';
  if (!i.ult.length) h += '<div class="lbl" style="padding:12px 0">Todavía no hay ventas registradas.</div>';
  h += i.ult.map(function(v){
    return '<div class="row"><span>'+esc(v.clientes ? v.clientes.nombre : '')+'<div class="sub">'+(v.forma === 'contado' ? 'Contado' : 'A crédito')+' · '+fdate(v.fecha)+' · Registrado por '+esc(nameOf(v.creado_por))+'</div></span><span>'+money(v.total)+'</span></div>';
  }).join('');
  return h;
}

function lineasTotal(){ var s = 0; S.v.lineas.forEach(function(l){ s += l.kilos * l.precio; }); return Math.round(s * 100) / 100; }

function vVenta(){
  var h = banner();
  h += '<div class="seg" style="margin-top:0"><button class="'+(S.vm === 'cli' ? 'on' : '')+'" onclick="A.setVm(\'cli\')">Cliente</button>' +
    '<button class="'+(S.vm === 'mos' ? 'on' : '')+'" onclick="A.setVm(\'mos\')">Total mostrador</button></div>';
  return h + (S.vm === 'mos' ? vMostrador() : vVentaCli());
}

function vVentaCli(){
  var cl = S.clientes.filter(function(c){ return c.activo; });
  var pr = S.productos.filter(function(p){ return p.activo; });
  var v = S.v;
  if (!cl.length || !pr.length) {
    var falta = (!cl.length ? 'clientes' : '') + (!cl.length && !pr.length ? ' y ' : '') + (!pr.length ? 'productos' : '');
    return '<div class="wn">Antes de vender hace falta crear ' + falta + '.' +
      (S.rol === 'admin' ? ' Hazlo en <b>Más</b>.' : ' Pídeselo al administrador.') + '</div>';
  }
  var h = '<div class="f"><div class="lbl">Cliente</div><select onchange="A.setCli(this.value)"><option value="">Elige un cliente</option>' +
    cl.map(function(c){ return '<option value="'+c.id+'"'+(v.cli === c.id ? ' selected' : '')+'>'+esc(c.nombre)+'</option>'; }).join('') + '</select></div>';
  var pid = v.prod || pr[0].id;
  h += '<div class="lbl">Producto y kilos</div><div style="display:flex;gap:8px;margin-bottom:6px">' +
    '<select style="flex:1" onchange="A.setProd(this.value)">' +
    pr.map(function(p){ return '<option value="'+p.id+'"'+(pid === p.id ? ' selected' : '')+'>'+esc(p.nombre)+' · '+money(p.precio_kg)+'/kg</option>'; }).join('') +
    '</select><input style="width:84px" type="text" inputmode="decimal" value="'+esc(v.kilos)+'" oninput="A.setKilos(this.value)" aria-label="Kilos">' +
    '<button class="ib" onclick="A.addL()" aria-label="Agregar producto">'+ic('plus')+'</button></div>';
  h += v.lineas.map(function(l, i){
    return '<div class="row"><span>'+esc(l.nombre)+' · '+l.kilos+' kg<div class="sub">'+money(l.precio)+'/kg</div></span><span class="r">'+money(l.kilos * l.precio)+
      '<button class="ib" style="border:none" onclick="A.delL('+i+')" aria-label="Quitar">'+ic('x',18)+'</button></span></div>';
  }).join('');
  h += '<div class="seg"><button class="'+(v.forma === 'contado' ? 'on' : '')+'" onclick="A.forma(\'contado\')">Contado</button>' +
    '<button class="'+(v.forma === 'credito' ? 'on' : '')+'" onclick="A.forma(\'credito\')">A crédito</button></div>';
  h += '<div class="row" style="font-weight:600;border:none"><span>Total</span><span>'+money(lineasTotal())+'</span></div>';
  h += '<button class="pri" style="width:100%;margin-top:6px"'+(S.busy ? ' disabled' : '')+' onclick="A.reg()">'+(S.busy ? 'Guardando…' : 'Registrar venta')+'</button>';
  return h;
}

function totM(){
  var s = 0;
  FP.forEach(function(p){ var x = num(S.mo.v[p[0]]); if (x > 0) s += x; });
  return Math.round(s * 100) / 100;
}

function vMostrador(){
  var m = S.mo, adm = S.rol === 'admin', h = '';
  if (m.cargando && !m.fecha) return '<div class="lbl">Cargando…</div>';
  h += adm
    ? '<div class="f"><div class="lbl">Fecha</div><input type="date" max="'+hoy()+'" value="'+esc(m.fecha)+'" onchange="A.pickD(this.value)"></div>'
    : '<div class="lbl" style="margin-bottom:6px">Hoy · '+fdate(m.fecha)+'</div>';
  h += FP.map(function(p){
    return '<div class="row"><span>'+p[1]+'</span><input type="text" inputmode="decimal" placeholder="0.00" value="'+esc(m.v[p[0]])+'" oninput="A.upM(\''+p[0]+'\',this.value)" aria-label="'+p[1]+'" style="width:120px"></div>';
  }).join('');
  h += '<div class="row" style="font-weight:600"><span>Total del día</span><span id="mt">'+money(totM())+'</span></div>';
  if (m.existe) h += '<div class="sub" style="margin:6px 0">Ya hay '+money(m.existe.total)+' registrado para este día'+(adm ? ' por '+esc(nameOf(m.existe.creado_por)) : '')+'. Se reemplazará al guardar.</div>';
  h += '<button class="pri" style="width:100%;margin-top:8px"'+(S.busy ? ' disabled' : '')+' onclick="A.saveM()">'+(S.busy ? 'Guardando…' : (m.existe ? 'Actualizar total del día' : 'Guardar total del día'))+'</button>';
  if (adm) {
    h += '<div class="h">Últimos 7 días</div>';

var TL = {ventas:'Venta', venta_items:'Detalle de venta', abonos:'Abono', cierres_mostrador:'Total de mostrador', clientes:'Cliente', proveedores:'Proveedor', productos:'Producto', perfiles:'Usuario', compras_proveedor:'Compra a proveedor', pagos_proveedor:'Pago a proveedor'};
var AL = {INSERT:'Creó', UPDATE:'Editó', DELETE:'Eliminó'};
var FLAB = {cliente_id:'Cliente', producto_id:'Producto', proveedor_id:'Proveedor', forma:'Forma', total:'Total', fecha:'Fecha', monto:'Monto', kilos:'Kilos', precio_kg:'Precio/kg', nombre:'Nombre', telefono:'Teléfono', activo:'Activo', rol:'Rol', correo:'Correo', efectivo:'Efectivo', punto_venta_1:'Punto de venta 1', punto_venta_2:'Punto de venta 2', pago_movil:'Pago móvil', nota:'Nota'};
var FHID = {id:1, creado_en:1, actualizado_en:1, creado_por:1, venta_id:1, subtotal:1};
var FMON = {total:1, monto:1, efectivo:1, punto_venta_1:1, punto_venta_2:1, pago_movil:1, precio_kg:1};

function fval(k, v){
  if (v === null || v === undefined || v === '') return '—';
  if (k === 'cliente_id') { var c = S.clientes.filter(function(x){ return x.id === v; })[0]; return c ? c.nombre : '(cliente)'; }
  if (k === 'proveedor_id') { var pv = S.proveedores.filter(function(x){ return x.id === v; })[0]; return pv ? pv.nombre : '(proveedor)'; }
  if (k === 'producto_id') { var p = S.productos.filter(function(x){ return x.id === v; })[0]; return p ? p.nombre : '(producto)'; }
  if (k === 'forma') return v === 'contado' ? 'Contado' : 'A crédito';
  if (k === 'fecha') return fdate(v);
  if (k === 'activo') return v ? 'Sí' : 'No';
  if (k === 'rol') return v === 'admin' ? 'Administrador' : 'Empleado';
  if (FMON[k]) return money(v);
  return String(v);
}

function resumen(a){
  var out = [], o;
  if (a.accion === 'UPDATE') {
    Object.keys(a.despues || {}).forEach(function(k){
      if (FHID[k]) return;
      var b = (a.antes || {})[k], d = a.despues[k];
      if (JSON.stringify(b) !== JSON.stringify(d)) out.push((FLAB[k] || k) + ': ' + fval(k, b) + ' → ' + fval(k, d));
    });
    if (!out.length) out.push('Sin cambios visibles');
  } else {
    o = a.accion === 'DELETE' ? a.antes : a.despues;
    Object.keys(o || {}).forEach(function(k){
      if (FHID[k] || o[k] === null || o[k] === '') return;
      out.push((FLAB[k] || k) + ': ' + fval(k, o[k]));
    });
  }
  return out.slice(0, 6);
}

/* ---------- Carga de datos ---------- */
async function cargarCatalogos(){
  var r = await Promise.all([
    db.from('clientes').select('id,nombre,telefono,activo').order('nombre'),
    db.from('productos').select('id,nombre,precio_kg,activo').order('nombre')
  ]);
  if (r[0].error) throw r[0].error;
  if (r[1].error) throw r[1].error;
  S.clientes = r[0].data; S.productos = r[1].data;
  if (S.rol === 'admin') {
    var rp = await db.from('proveedores').select('id,nombre,telefono,activo').order('nombre');
    if (rp.error) throw rp.error;
    S.proveedores = rp.data;
  }
}

async function cargarPerfiles(){
  var r = await db.from('perfiles').select('id,nombre,correo,rol,activo').order('nombre');
  if (r.error) throw r.error;
  S.perfiles = r.data; S.perfMap = {};
  r.data.forEach(function(p){ S.perfMap[p.id] = p; });
}

async function cargarTodo(){
  S.boot = true; render();
  try {
    var p = await db.from('perfiles').select('rol,nombre,activo').eq('id', S.user.id).maybeSingle();
    if (p.error) throw p.error;
    if (p.data && p.data.activo === false) {
      try { await db.auth.signOut(); } catch (x) {}
      S.user = null; S.rol = null; S.boot = false; S.busy = false;
      setErr('Tu usuario está desactivado. Habla con el administrador.');
      render(); return;
    }
    if (!p.data) { S.rol = null; }
    else { S.rol = p.data.rol; S.nombre = p.data.nombre || S.user.email; }
    if (S.rol) { await cargarCatalogos(); await cargarPerfiles(); }
    S.tab = S.rol === 'admin' ? 'inicio' : 'venta';
    S.vm = 'cli'; S.mo.fecha = hoy();
    S.err = ''; S.msg = '';
  } catch (e) { setErr(errTxt(e)); }
  S.boot = false; S.busy = false; render();
  if (S.rol === 'admin') cargarInicio();
}

async function cargarInicio(){
  try {
    var h = hoy();
    var r = await Promise.all([
      db.from('ventas').select('total,forma').eq('fecha', h),
      db.from('abonos').select('monto').eq('fecha', h),
      db.from('cierres_mostrador').select('total').eq('fecha', h).maybeSingle(),
      db.from('saldo_clientes').select('saldo'),
      db.from('ventas').select('total,forma,fecha,creado_por,clientes(nombre)').order('creado_en', {ascending:false}).limit(5),
      db.from('saldo_proveedores').select('saldo')
    ]);
    r.forEach(function(x){ if (x.error) throw x.error; });
    var vc = 0, contado = 0, ab = 0, pc = 0;
    r[0].data.forEach(function(x){ vc += +x.total; if (x.forma === 'contado') contado += +x.total; });
    r[1].data.forEach(function(x){ ab += +x.monto; });
    r[3].data.forEach(function(x){ if (+x.saldo > 0) pc += +x.saldo; });
    var pp = 0; r[5].data.forEach(function(x){ if (+x.saldo > 0) pp += +x.saldo; });
    var mos = r[2].data ? +r[2].data.total : 0;

A.saveM = async function(){
  if (S.busy) return;
  var m = S.mo, f = m.fecha || hoy(), vals = {}, malo = false;
  if (S.rol !== 'admin') f = hoy();
  FP.forEach(function(p){
    var raw = String(m.v[p[0]] || '').trim(), x = raw === '' ? 0 : num(raw);
    if (isNaN(x) || x < 0) malo = true;
    vals[p[0]] = Math.round(x * 100) / 100;
  });
  if (malo) { setErr('Revisa los montos: solo números, sin signos.'); render(); return; }
  var total = vals.efectivo + vals.punto_venta_1 + vals.punto_venta_2 + vals.pago_movil;
  if (!(total > 0)) { setErr('Escribe al menos un monto mayor que cero.'); render(); return; }
  S.busy = true; render();
  try {
    var sel = await db.from('cierres_mostrador').select('id').eq('fecha', f).maybeSingle();
    if (sel.error) throw sel.error;
    var r;
    if (sel.data) {
      r = await db.from('cierres_mostrador').update(vals).eq('id', sel.data.id).select('id');
      if (r.error) throw r.error;
      if (!r.data || !r.data.length) throw new Error('No tienes permiso para corregir ese registro.');
    } else {
      var row = {fecha:f}; Object.keys(vals).forEach(function(k){ row[k] = vals[k]; });
      r = await db.from('cierres_mostrador').insert(row);
      if (r.error) {
        if (r.error.code === '23505') throw new Error('Ese día ya tiene un total registrado por otra persona. Pídele al administrador que lo corrija.');
        throw r.error;
      }
    }
    setMsg('Total del ' + fdate(f) + ' guardado: ' + money(total));
    S.ini = null;
    await cargarMostrador(f);
  } catch (e) { setErr(errTxt(e)); }
  S.busy = false; render();
};
