<script>
(function () {
'use strict';

/* ---------- Conexión (claves públicas; la seguridad la dan los roles de la base de datos) ---------- */
var SUPABASE_URL = 'https://gkhomooeuogtwhasdyuo.supabase.co';
var SUPABASE_KEY = 'sb_publishable_6vB64x8E8iTsOIKfXsmzOg_yh2Gg0sU';
var VERSION = '5';

var app = document.getElementById('app');
if (!window.supabase) {
  app.innerHTML = '<div class="center" style="padding:24px;text-align:center">No se pudo cargar la aplicación. Revisa tu conexión a internet y vuelve a abrirla.</div>';
  return;
}
var db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var A = {};
window.A = A;

/* ---------- Utilidades ---------- */
var MS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ return '$' + (Math.round((+n || 0) * 100) / 100).toFixed(2); }
function num(s){ return parseFloat(String(s == null ? '' : s).replace(',', '.')); }
function fdate(s){ if(!s) return ''; var p = String(s).slice(0,10).split('-'); return (+p[2]) + ' ' + MS[+p[1]-1]; }
var PRES = [['entero','Entero'], ['ruedas','Ruedas'], ['filete','Filete']];
function presLab(k){ var x = PRES.filter(function(p){ return p[0] === k; })[0]; return x ? x[1] : k; }
function listaDe(p, k){ var v = p ? p['precio_' + k] : null; return (v === null || v === undefined) ? null : +v; }
function presDe(p){ return PRES.map(function(x){ return x[0]; }).filter(function(k){ return listaDe(p, k) !== null; }); }
function espDe(cli, pid, k){
  if (!cli) return null;
  return S.precios.filter(function(x){ return x.cliente_id === cli && x.producto_id === pid && x.presentacion === k; })[0] || null;
}
function precioDe(cli, p, k){
  var l = listaDe(p, k), e = espDe(cli, p.id, k);
  return e ? {precio:+e.precio, esp:true, lista:l} : {precio:l, esp:false, lista:l};
}
function tipoDe(id){ var c = S.clientes.filter(function(x){ return x.id === id; })[0]; return c && c.tipo === 'restaurante' ? 'restaurante' : 'particular'; }
function tgl(t, on, fn){ return '<button class="'+(on ? 'on' : '')+'" aria-pressed="'+on+'" onclick="'+fn+'">'+t+'</button>'; }
function filtroClientes(n){
  return '<div class="lbl" style="margin-bottom:4px">Mostrar</div><div class="seg" style="margin-top:0">' +
    tgl('Restaurantes ('+n.restaurante+')', S.cf.restaurante, "A.tfC('restaurante')") +
    tgl('Particulares ('+n.particular+')', S.cf.particular, "A.tfC('particular')") + '</div>';
}
function tagTipo(t){ return '<span class="tag'+(t === 'restaurante' ? ' r' : '')+'">'+(t === 'restaurante' ? 'Restaurante' : 'Particular')+'</span>'; }
function opcionesClientes(cl, sel){
  var g = {restaurante:[], particular:[]};
  cl.forEach(function(c){ g[c.tipo === 'restaurante' ? 'restaurante' : 'particular'].push(c); });
  function opts(a){ return a.map(function(c){ return '<option value="'+c.id+'"'+(sel === c.id ? ' selected' : '')+'>'+esc(c.nombre)+'</option>'; }).join(''); }
  return (g.restaurante.length ? '<optgroup label="Restaurantes">'+opts(g.restaurante)+'</optgroup>' : '') +
         (g.particular.length ? '<optgroup label="Particulares">'+opts(g.particular)+'</optgroup>' : '');
}
async function all(mk){
  var out = [], from = 0, step = 1000;
  while (true) {
    var r = await mk().range(from, from + step - 1);
    if (r.error) throw r.error;
    out = out.concat(r.data);
    if (r.data.length < step) break;
    from += step;
  }
  return out;
}
function hoy(){ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Caracas'}).format(new Date()); }
function addDays(s, n){ var p = s.split('-'); return new Date(Date.UTC(+p[0], +p[1]-1, +p[2] + n)).toISOString().slice(0,10); }
function dtime(ts){
  try { return new Date(ts).toLocaleString('es-VE', {timeZone:'America/Caracas', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}); }
  catch (e) { return String(ts); }
}
function errTxt(e){
  var m = (e && e.message) || String(e || '');
  if (/Failed to fetch|NetworkError|Load failed|network/i.test(m)) return 'Sin conexión. Revisa tu internet e inténtalo de nuevo.';
  if (/row-level security|permission denied/i.test(m)) return 'Tu usuario no tiene permiso para esta acción.';
  if (/Invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  return m || 'Ocurrió un error. Inténtalo de nuevo.';
}
var IC = {
  home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  cobrar:'<path d="M17 7L7 17M17 17H7V7"/>',
  pagar:'<path d="M7 17L17 7M7 7h10v10"/>',
  chart:'<path d="M4 20V11M10 20V4M16 20v-6M22 20H2"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  out:'<path d="M9 21H5V3h4M16 17l5-5-5-5M21 12H9"/>',
  back:'<path d="M15 6l-6 6 6 6"/>',
  next:'<path d="M9 6l6 6-6 6"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
function ic(n, s){ s = s || 20; return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>'; }
function setMsg(m){ S.msg = m; S.err = ''; }
function setErr(m){ S.err = m; S.msg = ''; }

/* Formas de pago del mostrador: [columna en la base de datos, etiqueta] */
var FP = [['efectivo','Efectivo'], ['punto_venta_1','Punto de venta 1'], ['punto_venta_2','Punto de venta 2'], ['pago_movil','Pago móvil']];

/* ---------- Estado ---------- */
var S = {
  boot:true, user:null, rol:null, nombre:'', em:'', tab:'venta', busy:false, msg:'', err:'',
  clientes:[], productos:[], proveedores:[], perfiles:[], perfMap:{},
  vm:'cli',
  v:{cli:'', prod:'', kilos:'1', lineas:[], forma:'contado'},
  mo:{fecha:'', v:{efectivo:'', punto_venta_1:'', punto_venta_2:'', pago_movil:''}, existe:null, lista:[], cargando:false},
  ini:null, saldos:null, hist:null, mas:'menu', ce:null, pe:null, pf:null, pve:null,
  pagar:{saldos:null, hist:null, compra:null},
  rep:{per:'sem', ref:'', rk:null, datos:null},
  sa:null,
  precios:[], cf:{restaurante:true, particular:true}, sp:null,
  q:[], off:false, syncP:null, rerun:false,
  aud:{filtro:'', lista:null}
};

function nameOf(id){
  if (!id) return 'Sistema';
  var p = S.perfMap[id];
  if (p) return p.nombre || p.correo || 'Usuario';
  return (S.user && id === S.user.id) ? S.nombre : 'Usuario';
}

/* ---------- Modo sin conexión: cola de registros pendientes ---------- */
function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function uuid(){
  if (window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  var b = new Uint8Array(16); window.crypto.getRandomValues(b);
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  var h = Array.prototype.map.call(b, function(x){ return ('0' + x.toString(16)).slice(-2); }).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' + h.slice(16, 20) + '-' + h.slice(20);
}
function esRed(e){
  var m = (e && e.message) || String(e || '');
  return navigator.onLine === false || /Failed to fetch|NetworkError|Load failed|network|tiempo agotado|fetch|JWT|expired/i.test(m);
}
function dup(e){ return !!e && (e.code === '23505' || /duplicate key/i.test(e.message || '')); }
function conTiempo(p, ms){
  return new Promise(function(res, rej){
    var t = setTimeout(function(){ rej(new Error('Failed to fetch (tiempo agotado)')); }, ms || 20000);
    p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); });
  });
}
function qKey(){ return 'cola_' + (S.user ? S.user.id : 'x'); }
function qLoad(){ S.q = (S.user && lsGet(qKey())) || []; }
function qSave(){ return lsSet(qKey(), S.q); }
function enqueue(tipo, payload){
  var j = {id:uuid(), tipo:tipo, payload:payload, ts:new Date().toISOString(), est:'pend', err:'', n:0};
  S.q.push(j);
  if (!qSave()) { S.q.pop(); return null; }
  return j;
}
function cacheCat(){
  if (!S.user) return;
  lsSet('cat_' + S.user.id, {t:Date.now(), clientes:S.clientes, productos:S.productos, precios:S.precios, proveedores:S.proveedores});
}

async function correr(j){
  var p = j.payload, r;
  if (j.tipo === 'venta') {
    r = await conTiempo(db.from('ventas').insert(p.venta), 20000);
    if (r.error && !dup(r.error)) throw r.error;
    r = await conTiempo(db.from('venta_items').insert(p.items), 20000);
    if (r.error && !dup(r.error)) throw r.error;
    return;
  }
  if (j.tipo === 'mostrador') {
    var sel = await conTiempo(db.from('cierres_mostrador').select('id').eq('fecha', p.fecha).maybeSingle(), 20000);
    if (sel.error) throw sel.error;
    if (sel.data) {
      r = await conTiempo(db.from('cierres_mostrador').update(p.vals).eq('id', sel.data.id).select('id'), 20000);
      if (r.error) throw r.error;
      if (!r.data || !r.data.length) throw new Error('No tienes permiso para corregir ese registro.');
    } else {
      var row = {fecha:p.fecha}; Object.keys(p.vals).forEach(function(k){ row[k] = p.vals[k]; });
      r = await conTiempo(db.from('cierres_mostrador').insert(row), 20000);
      if (r.error) {
        if (r.error.code === '23505') throw new Error('Ese día ya tiene un total registrado por otra persona. Pídele al administrador que lo corrija.');
        throw r.error;
      }
    }
    return;
  }
  throw new Error('Tipo de registro desconocido.');
}

async function pasada(){
  var cambio = false;
  for (var i = 0; i < S.q.length; i++) {
    var j = S.q[i];
    if (j.est === 'error') continue;
    try {
      await correr(j);
      S.q.splice(i, 1); i--; qSave(); cambio = true;
    } catch (e) {
      j.n = (j.n || 0) + 1;
      if (esRed(e)) { qSave(); break; }
      j.est = 'error'; j.err = errTxt(e); qSave(); cambio = true;
    }
  }
  if (cambio) { S.ini = null; S.saldos = null; if (S.user) render(); }
}

function sync(){
  if (!S.user) return Promise.resolve();
  if (S.syncP) { S.rerun = true; return S.syncP; }
  S.syncP = (async function(){
    do { S.rerun = false; await pasada(); } while (S.rerun);
  })().then(function(){ S.syncP = null; }, function(){ S.syncP = null; });
  return S.syncP;
}

function estadoBar(){
  var n = S.q.filter(function(j){ return j.est !== 'error'; }).length, e = S.q.length - n;
  if (navigator.onLine === false) {
    return '<div class="wn">Sin conexión. Puedes seguir registrando ventas y el total de mostrador: se enviarán cuando vuelva el internet.' +
      (S.q.length ? ' <a href="#" style="color:inherit;font-weight:600" onclick="A.go(\'cola\');return false">Pendientes: '+S.q.length+'</a>' : '') + '</div>';
  }
  if (S.q.length) {
    return '<div class="wn" style="cursor:pointer" onclick="A.go(\'cola\')">' + (n ? n + (n === 1 ? ' registro pendiente de enviar' : ' registros pendientes de enviar') : '') +
      (n && e ? ' · ' : '') + (e ? e + (e === 1 ? ' con error' : ' con error') : '') + '. Toca para ver.</div>';
  }
  return '';
}

function vSinRed(){
  return '<div class="lbl" style="padding:32px 0 16px;text-align:center">Esta sección necesita conexión a internet.<br>Mientras tanto puedes registrar ventas y el total de mostrador.</div>' +

}

function tituloJob(j){
  var p = j.payload;
  if (j.tipo === 'venta') return 'Venta ' + money(p.venta.total) + ' · ' + esc(p.cli || 'cliente');
  if (j.tipo === 'mostrador') return 'Total de mostrador ' + money(p.total) + ' · ' + fdate(p.fecha);

function vCola(){
  var h = '<button onclick="A.volverCola()" style="margin-bottom:10px;display:inline-flex;align-items:center;gap:4px">'+ic('back',18)+' Volver</button>' + banner();

    return '<div class="row"><span>'+p[1]+'</span><input type="text" inputmode="decimal" placeholder="0.00" value="'+esc(m.v[p[0]])+'" oninput="A.upM(\''+p[0]+'\',this.value)" aria-label="'+p[1]+'" style="width:120px"></div>';

function rango(per, ref){
  var p = ref.split('-'), t = Date.UTC(+p[0], +p[1]-1, +p[2]), d = new Date(t), st, en;
  if (per === 'sem') { st = t - ((d.getUTCDay() + 6) % 7) * 864e5; en = st + 6 * 864e5; }
  else { st = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1); en = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 0); }
  return [new Date(st).toISOString().slice(0, 10), new Date(en).toISOString().slice(0, 10)];
}
function labR(){
  var R = S.rep, r = rango(R.per, R.ref), a = r[0].split('-'), b = r[1].split('-');
  if (R.per === 'mes') return MN[+a[1] - 1] + ' ' + a[0];
  if (a[1] === b[1]) return (+a[2]) + '–' + (+b[2]) + ' ' + MS[+b[1] - 1] + ' ' + b[0];
  return (+a[2]) + ' ' + MS[+a[1] - 1] + ' – ' + (+b[2]) + ' ' + MS[+b[1] - 1] + ' ' + b[0];
}
function curR(){ var r = rango(S.rep.per, S.rep.ref), h = hoy(); return h >= r[0] && h <= r[1]; }

var TL = {ventas:'Venta', venta_items:'Detalle de venta', abonos:'Abono', cierres_mostrador:'Total de mostrador', clientes:'Cliente', proveedores:'Proveedor', productos:'Producto', perfiles:'Usuario', compras_proveedor:'Compra a proveedor', pagos_proveedor:'Pago a proveedor', precios_cliente:'Precio especial'};
var AL = {INSERT:'Creó', UPDATE:'Editó', DELETE:'Eliminó'};
var FLAB = {cliente_id:'Cliente', producto_id:'Producto', proveedor_id:'Proveedor', forma:'Forma', total:'Total', fecha:'Fecha', monto:'Monto', kilos:'Kilos', precio_kg:'Precio/kg', nombre:'Nombre', telefono:'Teléfono', activo:'Activo', rol:'Rol', correo:'Correo', efectivo:'Efectivo', punto_venta_1:'Punto de venta 1', punto_venta_2:'Punto de venta 2', pago_movil:'Pago móvil', nota:'Nota', es_saldo_anterior:'Saldo anterior', tipo:'Tipo', presentacion:'Presentación', precio:'Precio especial', precio_entero:'Precio entero', precio_ruedas:'Precio ruedas', precio_filete:'Precio filete'};
var FHID = {id:1, creado_en:1, actualizado_en:1, creado_por:1, venta_id:1, subtotal:1};
var FMON = {total:1, monto:1, efectivo:1, punto_venta_1:1, punto_venta_2:1, pago_movil:1, precio_kg:1, precio:1, precio_entero:1, precio_ruedas:1, precio_filete:1};

function fval(k, v){
  if (v === null || v === undefined || v === '') return '—';
  if (typeof v === 'boolean') return v ? 'Sí' : 'No';
  if (k === 'tipo') return v === 'restaurante' ? 'Restaurante' : 'Particular';
  if (k === 'presentacion') return presLab(v);
  if (k === 'cliente_id') { var c = S.clientes.filter(function(x){ return x.id === v; })[0]; return c ? c.nombre : '(cliente)'; }
  if (k === 'proveedor_id') { var pv = S.proveedores.filter(function(x){ return x.id === v; })[0]; return pv ? pv.nombre : '(proveedor)'; }
  if (k === 'producto_id') { var p = S.productos.filter(function(x){ return x.id === v; })[0]; return p ? p.nombre : '(producto)'; }
  if (k === 'forma') return v === 'contado' ? 'Contado' : 'A crédito';
  if (k === 'fecha') return fdate(v);
  if (k === 'activo') return v ? 'Sí' : 'No';
  if (k === 'rol') return v === 'admin' ? 'Administrador' : 'Empleado';
  if (FMON[k]) return money(v);
  return String(v);
}

function resumen(a){
  var out = [], o;
  if (a.accion === 'UPDATE') {
    Object.keys(a.despues || {}).forEach(function(k){
      if (FHID[k]) return;
      var b = (a.antes || {})[k], d = a.despues[k];
      if (JSON.stringify(b) !== JSON.stringify(d)) out.push((FLAB[k] || k) + ': ' + fval(k, b) + ' → ' + fval(k, d));
    });
    if (!out.length) out.push('Sin cambios visibles');
  } else {
    o = a.accion === 'DELETE' ? a.antes : a.despues;
    Object.keys(o || {}).forEach(function(k){
      if (FHID[k] || o[k] === null || o[k] === '' || (k === 'es_saldo_anterior' && !o[k])) return;
      out.push((FLAB[k] || k) + ': ' + fval(k, o[k]));
    });
  }
  return out.slice(0, 6);
}

async function cargarCatalogos(){
  var r = await Promise.all([
    db.from('clientes').select('id,nombre,telefono,activo,tipo').order('nombre'),
    db.from('productos').select('id,nombre,precio_entero,precio_ruedas,precio_filete,activo').order('nombre'),
    db.from('precios_cliente').select('id,cliente_id,producto_id,presentacion,precio')
  ]);
  if (r[0].error) throw r[0].error;
  if (r[1].error) throw r[1].error;
  if (r[2].error) throw r[2].error;
  S.clientes = r[0].data; S.productos = r[1].data; S.precios = r[2].data;
  if (S.rol === 'admin') {

async function cargarReporte(){
  var R = S.rep, rg = rango(R.per, R.ref), d1 = rg[0], d2 = rg[1], per = R.per;
  R.datos = null; if (S.tab === 'reporte') render();
  try {
    var r = await Promise.all([
      all(function(){ return db.from('ventas').select('cliente_id,total,forma,fecha').eq('es_saldo_anterior', false).gte('fecha', d1).lte('fecha', d2).order('fecha').order('id'); }),
      all(function(){ return db.from('abonos').select('cliente_id,monto,fecha').gte('fecha', d1).lte('fecha', d2).order('fecha').order('id'); }),
      all(function(){ return db.from('cierres_mostrador').select('fecha,efectivo,punto_venta_1,punto_venta_2,pago_movil,total').gte('fecha', d1).lte('fecha', d2).order('fecha').order('id'); }),
      db.from('saldo_clientes').select('id,nombre,credito_total,abonado_total,saldo').gt('saldo', 0).order('saldo', {ascending:false}),
      db.from('saldo_proveedores').select('id,nombre,compras_total,pagos_total,saldo').gt('saldo', 0).order('saldo', {ascending:false})
    ]);
    if (r[3].error) throw r[3].error;
    if (r[4].error) throw r[4].error;
    var cur = rango(R.per, R.ref);
    if (R.per !== per || cur[0] !== d1 || cur[1] !== d2) return;
    var cli = {};
    function g(id){ return cli[id] || (cli[id] = {vt:0, nv:0, ct:0, ab:0}); }
    function cn(id){ var c = S.clientes.filter(function(x){ return x.id === id; })[0]; return c ? c.nombre : '(cliente)'; }
    r[0].forEach(function(v){ var o = g(v.cliente_id); o.vt += +v.total; o.nv++; if (v.forma === 'contado') o.ct += +v.total; });
    r[1].forEach(function(a){ g(a.cliente_id).ab += +a.monto; });
    var mos = {tot:0, dias:0, efectivo:0, punto_venta_1:0, punto_venta_2:0, pago_movil:0};
    r[2].forEach(function(c){ mos.tot += +c.total; mos.dias++; FP.forEach(function(p){ mos[p[0]] += +c[p[0]]; }); });
    var rows = {ventas:[], cobrado:[], xcobrar:[], xpagar:[]};
    if (mos.tot > 0) {
      rows.ventas.push({n:'Mostrador', kind:null, sub:mos.dias + (mos.dias === 1 ? ' día registrado' : ' días registrados'), v:mos.tot});
      var abr = {efectivo:'Efectivo', punto_venta_1:'Punto 1', punto_venta_2:'Punto 2', pago_movil:'Pago móvil'};
      rows.cobrado.push({n:'Mostrador', kind:null, sub:FP.map(function(p){ return mos[p[0]] > 0 ? abr[p[0]] + ' ' + money(mos[p[0]]) : ''; }).filter(Boolean).join(' · '), v:mos.tot});
    }
    Object.keys(cli).forEach(function(id){
      var o = cli[id];
      if (o.vt > 0) rows.ventas.push({n:cn(id), kind:'c', id:id, sub:o.nv + (o.nv === 1 ? ' venta' : ' ventas'), v:o.vt});
      if (o.ct + o.ab > 0) rows.cobrado.push({n:cn(id), kind:'c', id:id, sub:[o.ct ? 'Contado ' + money(o.ct) : '', o.ab ? 'Abonos ' + money(o.ab) : ''].filter(Boolean).join(' · '), v:o.ct + o.ab});
    });
    r[3].data.forEach(function(x){ rows.xcobrar.push({n:x.nombre, kind:'c', id:x.id, sub:'Crédito ' + money(x.credito_total) + ' · Abonos ' + money(x.abonado_total), v:+x.saldo}); });
    r[4].data.forEach(function(x){ rows.xpagar.push({n:x.nombre, kind:'p', id:x.id, sub:'Compras ' + money(x.compras_total) + ' · Pagos ' + money(x.pagos_total), v:+x.saldo}); });
    var tot = {};
    Object.keys(rows).forEach(function(k){
      rows[k].sort(function(a, b){ return b.v - a.v; });
      var t = 0; rows[k].forEach(function(x){ t += x.v; }); tot[k] = Math.round(t * 100) / 100;
    });
    /* barras: por día (semana) o por semana (mes) */
    var vals, labels, DAY = 864e5;
    function ts(f){ var p = f.split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]); }
    if (per === 'sem') {
      vals = [0, 0, 0, 0, 0, 0, 0]; labels = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
      r[0].forEach(function(v){ vals[Math.round((ts(v.fecha) - ts(d1)) / DAY)] += +v.total; });
      r[2].forEach(function(c){ vals[Math.round((ts(c.fecha) - ts(d1)) / DAY)] += +c.total; });
    } else {
      var fm = ts(d1) - ((new Date(ts(d1)).getUTCDay() + 6) % 7) * DAY, n = Math.floor((ts(d2) - fm) / (7 * DAY)) + 1;
      vals = []; labels = [];
      for (var i = 0; i < n; i++) { vals.push(0); labels.push('S' + (i + 1)); }
      r[0].forEach(function(v){ vals[Math.floor((ts(v.fecha) - fm) / (7 * DAY))] += +v.total; });
      r[2].forEach(function(c){ vals[Math.floor((ts(c.fecha) - fm) / (7 * DAY))] += +c.total; });
    }
    R.datos = {per:per, d1:d1, d2:d2, rows:rows, tot:tot, bars:{vals:vals, labels:labels}};
  } catch (e) { setErr(errTxt(e)); R.datos = null; }
  if (S.tab === 'reporte') render();
}

A.saveM = async function(){
  if (S.busy) return;
  var m = S.mo, f = m.fecha || hoy(), vals = {}, malo = false;
  if (S.rol !== 'admin') f = hoy();
  FP.forEach(function(p){
    var raw = String(m.v[p[0]] || '').trim(), x = raw === '' ? 0 : num(raw);
    if (isNaN(x) || x < 0) malo = true;
    vals[p[0]] = Math.round(x * 100) / 100;
  });
  if (malo) { setErr('Revisa los montos: solo números, sin signos.'); render(); return; }
  var total = vals.efectivo + vals.punto_venta_1 + vals.punto_venta_2 + vals.pago_movil;
  if (!(total > 0)) { setErr('Escribe al menos un monto mayor que cero.'); render(); return; }
  S.busy = true; render();
  var j = enqueue('mostrador', {fecha:f, vals:vals, total:Math.round(total * 100) / 100});
  if (!j) { S.busy = false; setErr('No se pudo guardar en este teléfono. Libera espacio e inténtalo de nuevo.'); render(); return; }
  await sync();
  if (S.q.indexOf(j) < 0) {
    setMsg('Total del ' + fdate(f) + ' guardado: ' + money(total));
    S.ini = null;
    if (navigator.onLine !== false) await cargarMostrador(f);
  } else if (j.est === 'error') {
    setErr('No se pudo enviar el total: ' + j.err + ' Revísalo en Pendientes.');
  } else {
    setMsg('Total del ' + fdate(f) + ' guardado en el teléfono: ' + money(total) + '. Se enviará cuando vuelva el internet.');
  }
  S.busy = false; render();
};

A.verHistP = async function(id){

  S.msg = ''; S.err = ''; render();
  try {

      db.from('compras_proveedor').select('fecha,total,nota,creado_en,creado_por').eq('proveedor_id', id).order('creado_en', {ascending:false}).limit(200),
      db.from('pagos_proveedor').select('fecha,monto,nota,creado_en,creado_por').eq('proveedor_id', id).order('creado_en', {ascending:false}).limit(200),
      db.from('saldo_proveedores').select('saldo').eq('id', id).maybeSingle()

function tituloRep(){ return 'Reporte ' + (S.rep.per === 'sem' ? 'semanal' : 'mensual') + ' · ' + labR(); }
function textoRep(){
  var D = S.rep.datos;
  return tituloRep() + '\nVentas: ' + money(D.tot.ventas) + '\nCobrado: ' + money(D.tot.cobrado) +
    '\nPor cobrar (saldo actual): ' + money(D.tot.xcobrar) + '\nPor pagar (saldo actual): ' + money(D.tot.xpagar);
}
function csvRep(){
  var D = S.rep.datos, L = ['Sección;Cuenta;Detalle;Monto'];
  function q(t){ return '"' + String(t).replace(/"/g, '""') + '"'; }
  function m(n){ return (Math.round(n * 100) / 100).toFixed(2).replace('.', ','); }
  SEC.forEach(function(s){
    L.push(q(s[1]) + ';TOTAL;;' + m(D.tot[s[0]]));
    D.rows[s[0]].forEach(function(x){ L.push(q(s[1]) + ';' + q(x.n) + ';' + q(x.sub) + ';' + m(x.v)); });
  });
  return '\uFEFF' + L.join('\r\n');
}
function pdfRep(){
  var J = window.jspdf && window.jspdf.jsPDF;
  if (!J) throw new Error('No se pudo cargar el generador de PDF. Revisa tu conexión e inténtalo de nuevo.');
  var D = S.rep.datos, doc = new J({unit:'mm', format:'a4'}), y = 18;
  function sitio(n){ if (y + n > 285) { doc.addPage(); y = 18; } }
  doc.setFont('helvetica', 'bold'); doc.setFontSize(16); doc.text('Reporte ' + (D.per === 'sem' ? 'semanal' : 'mensual'), 14, y); y += 7;
  doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.text('Pescadería El Mero Mero · ' + labR(), 14, y); y += 5;
  doc.setFontSize(9); doc.text('Generado el ' + fdate(hoy()) + ' por ' + S.nombre, 14, y); y += 9;
  SEC.forEach(function(s){
    sitio(18);
    doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(0);
    doc.text(s[1], 14, y); doc.text(money(D.tot[s[0]]), 196, y, {align:'right'}); y += 2; doc.line(14, y, 196, y); y += 5;
    var rows = D.rows[s[0]];
    if (!rows.length) { doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.text('Sin movimientos', 14, y); y += 7; }
    rows.forEach(function(r){
      sitio(11);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10); doc.setTextColor(0);
      doc.text(String(r.n).slice(0, 60), 14, y); doc.text(money(r.v), 196, y, {align:'right'}); y += 4.5;
      doc.setFontSize(8); doc.setTextColor(110); doc.text(String(r.sub).slice(0, 110), 14, y); doc.setTextColor(0); y += 5;
    });
    y += 4;
  });
  return doc.output('blob');
}
async function entregar(blob, nombre, tipo){
  var file = null;
  try { file = new File([blob], nombre, {type:tipo}); } catch (e) {}
  if (file && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title:nombre}); return; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
}
A.descargar = async function(tipo){
  if (!S.rep.datos) return;
  try {
    var base = 'reporte-' + (S.rep.per === 'sem' ? 'semanal' : 'mensual') + '-' + S.rep.datos.d1;
    if (tipo === 'pdf') await entregar(pdfRep(), base + '.pdf', 'application/pdf');
    else await entregar(new Blob([csvRep()], {type:'text/csv;charset=utf-8'}), base + '.csv', 'text/csv');
    setMsg('Archivo listo: ' + base + '.' + (tipo === 'pdf' ? 'pdf' : 'csv'));
  } catch (e) { setErr(errTxt(e)); }
  render();
};
A.compartir = async function(){

  var t = textoRep();
  try {
    if (navigator.share) { await navigator.share({title:tituloRep(), text:t}); }
    else if (navigator.clipboard) { await navigator.clipboard.writeText(t); setMsg('Resumen copiado. Pégalo en WhatsApp o donde quieras.'); }
    else { setErr('Tu navegador no permite compartir desde aquí.'); }
  } catch (e) { if (!e || e.name !== 'AbortError') setErr(errTxt(e)); }
  render();
};

  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}

(async function(){
  try {
    var r = await db.auth.getSession();
    if (r.data && r.data.session) { S.user = r.data.session.user; await cargarTodo(); return; }
    var u = lsGet('ult_usuario');
    if (u && ((r.error && esRed(r.error)) || navigator.onLine === false)) { entrarSinConexion(u); return; }
  } catch (e) {
    var u2 = lsGet('ult_usuario');
    if (u2 && esRed(e)) { entrarSinConexion(u2); return; }
    setErr(errTxt(e));
  }
  S.boot = false; render();
})();

})();
</script>
